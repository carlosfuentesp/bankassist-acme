command:
  - sh
  - -c
  - >-
    exec streamlit run src/app/app.py
    --server.port="${DATABRICKS_APP_PORT:-8000}"
    --server.address="0.0.0.0"
env:
  - name: STREAMLIT_SERVER_ENABLE_CORS
    value: "false"
  - name: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
    value: "false"
  - name: BANKASSIST_GENIE_SPACE_ID
    valueFrom: genie-space
  - name: BANKASSIST_FOUNDATION_MODEL
    valueFrom: serving-endpoint
  - name: BANKASSIST_AI_SEARCH_INDEX
    valueFrom: policy-index
