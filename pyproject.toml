[project]
name = "bankassist-acme"
version = "0.1.0"
description = "Grounded collections assistant for Banco ACME on Databricks"
requires-python = ">=3.11,<3.13"
dependencies = [
    "databricks-langchain==0.20.0",
    "databricks-mcp>=0.3.0",
    "databricks-openai==0.17.1",
    "databricks-sdk>=0.94.0",
    "mlflow>=3.0,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[project.scripts]
bankassist = "agents.bankassist.cli:main"
bankassist-evaluate = "agents.bankassist.evaluation:main"
bankassist-job = "agents.bankassist.job:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests/unit"]

[tool.ruff]
line-length = 100
target-version = "py311"
builtins = ["spark"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
