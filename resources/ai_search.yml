resources:
  vector_search_endpoints:
    policy_search_endpoint:
      name: bankassist-acme-ai-search-${bundle.target}
      endpoint_type: STANDARD

  vector_search_indexes:
    policy_chunks_index:
      name: bank_acme.ai.policy_chunks_index
      endpoint_name: ${resources.vector_search_endpoints.policy_search_endpoint.name}
      primary_key: chunk_id
      index_type: DELTA_SYNC
      index_subtype: HYBRID

      delta_sync_index_spec:
        source_table: bank_acme.ai.policy_chunks_source
        pipeline_type: TRIGGERED

        embedding_source_columns:
          - name: chunk_text
            embedding_model_endpoint_name: databricks-qwen3-embedding-0-6b

        columns_to_sync:
          - chunk_id
          - chunk_text
          - policy_id
          - version
          - effective_date
          - classification
          - status
          - file_name
          - source_path
          - chunk_index