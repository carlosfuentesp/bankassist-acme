bundle:
  name: bankassist_acme
  uuid: b1212dfa-0cda-4782-a156-1fd5d87852cc
  engine: direct

include:
  - resources/*.yml

variables:
  catalog:
    description: The catalog to use

  schema:
    description: The schema to use

  structured_source_path:
    description: Source directory for synthetic structured data

  documents_source_path:
    description: Source directory for Banco ACME policy documents

  genie_space_id:
    description: Existing Genie space used by BankAssist

  foundation_model:
    description: Foundation model serving endpoint

artifacts:
  default:
    type: whl
    build: uv build

targets:
  dev:
    mode: development
    default: true

    workspace:
      host: https://dbc-93a995ef-4ab5.cloud.databricks.com

    variables:
      catalog: bank_acme
      schema: ${workspace.current_user.short_name}
      structured_source_path: /Volumes/bank_acme/bronze/raw/structured
      documents_source_path: /Volumes/bank_acme/bronze/raw/documents
      genie_space_id: 01f1b55197c11b7995b4599d90badc02
      foundation_model: databricks-qwen3-next-80b-a3b-instruct

  prod:
    mode: production

    workspace:
      host: https://dbc-93a995ef-4ab5.cloud.databricks.com
      root_path: /Workspace/Users/educharlief@hotmail.com/.bundle/${bundle.name}/${bundle.target}

    variables:
      catalog: bank_acme
      schema: prod
      structured_source_path: /Volumes/bank_acme/bronze/raw/structured
      documents_source_path: /Volumes/bank_acme/bronze/raw/documents
      genie_space_id: 01f1b55197c11b7995b4599d90badc02
      foundation_model: databricks-qwen3-next-80b-a3b-instruct

    permissions:
      - user_name: educharlief@hotmail.com
        level: CAN_MANAGE
