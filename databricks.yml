bundle:
  name: bankassist_acme
  uuid: b1212dfa-0cda-4782-a156-1fd5d87852cc

include:
  - resources/*.yml

variables:
  catalog:
    description: The catalog to use

  schema:
    description: The schema to use

  structured_source_path:
    description: Source directory for synthetic structured data

targets:
  dev:
    mode: development
    default: true

    workspace:
      host: https://dbc-93a995ef-4ab5.cloud.databricks.com

    variables:
      catalog: bank_acme
      schema: ${workspace.current_user.short_name}
      structured_source_path: /Volumes/bank_acme/bronze/raw/structured

  prod:
    mode: production

    workspace:
      host: https://dbc-93a995ef-4ab5.cloud.databricks.com
      root_path: /Workspace/Users/educharlief@hotmail.com/.bundle/${bundle.name}/${bundle.target}

    variables:
      catalog: bank_acme
      schema: prod
      structured_source_path: /Volumes/bank_acme/bronze/raw/structured

    permissions:
      - user_name: educharlief@hotmail.com
        level: CAN_MANAGE