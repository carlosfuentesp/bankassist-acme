# This is a Declarative Automation Bundle definition for bankassist_acme.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bankassist_acme
  uuid: b1212dfa-0cda-4782-a156-1fd5d87852cc

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-93a995ef-4ab5.cloud.databricks.com
    variables:
      catalog: bank_acme
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-93a995ef-4ab5.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/educharlief@hotmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/educharlief@hotmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bank_acme
      schema: prod
    permissions:
      - user_name: educharlief@hotmail.com
        level: CAN_MANAGE
