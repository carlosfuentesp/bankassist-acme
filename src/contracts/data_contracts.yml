version: 1

datasets:

  customers:
    primary_key:
      - customer_id

    columns:
      customer_id:
        type: string
        nullable: false
      full_name:
        type: string
        nullable: false
      city:
        type: string
        nullable: false
      customer_segment:
        type: string
        nullable: false
        allowed_values:
          - MASS
          - AFFLUENT

  loans:
    primary_key:
      - loan_id

    foreign_keys:
      - columns: [customer_id]
        references: customers.customer_id

    columns:
      loan_id:
        type: string
        nullable: false
      customer_id:
        type: string
        nullable: false
      product_type:
        type: string
        nullable: false
        allowed_values:
          - CONSUMER_LOAN
      original_amount:
        type: decimal(12,2)
        nullable: false
        min_exclusive: 0
      outstanding_balance:
        type: decimal(12,2)
        nullable: false
        min: 0
      days_past_due:
        type: integer
        nullable: false
        min: 0
      status:
        type: string
        nullable: false
        allowed_values:
          - CURRENT
          - PAST_DUE
      snapshot_date:
        type: date
        nullable: false

  installments:
    primary_key:
      - installment_id

    foreign_keys:
      - columns: [loan_id]
        references: loans.loan_id

    columns:
      installment_id:
        type: string
        nullable: false
      loan_id:
        type: string
        nullable: false
      due_date:
        type: date
        nullable: false
      amount_due:
        type: decimal(12,2)
        nullable: false
        min_exclusive: 0
      amount_paid:
        type: decimal(12,2)
        nullable: false
        min: 0
      status:
        type: string
        nullable: false
        allowed_values:
          - PAID
          - PARTIAL
          - OVERDUE
          - PENDING

  payments:
    primary_key:
      - payment_id

    foreign_keys:
      - columns: [loan_id]
        references: loans.loan_id

    columns:
      payment_id:
        type: string
        nullable: false
      loan_id:
        type: string
        nullable: false
      payment_date:
        type: timestamp
        nullable: false
      amount:
        type: decimal(12,2)
        nullable: false
        min_exclusive: 0
      channel:
        type: string
        nullable: false
        allowed_values:
          - MOBILE_BANKING
          - TRANSFER
          - BRANCH
          - AUTO_DEBIT

  payment_promises:
    primary_key:
      - promise_id

    foreign_keys:
      - columns: [customer_id]
        references: customers.customer_id

    columns:
      promise_id:
        type: string
        nullable: false
      customer_id:
        type: string
        nullable: false
      promise_date:
        type: date
        nullable: false
      promised_payment_date:
        type: date
        nullable: false
      promised_amount:
        type: decimal(12,2)
        nullable: false
        min_exclusive: 0
      status:
        type: string
        nullable: false
        allowed_values:
          - ACTIVE
          - KEPT
          - BROKEN

  payment_arrangements:
    primary_key:
      - arrangement_id

    foreign_keys:
      - columns: [customer_id]
        references: customers.customer_id

    columns:
      arrangement_id:
        type: string
        nullable: false
      customer_id:
        type: string
        nullable: false
      arrangement_date:
        type: date
        nullable: false
      status:
        type: string
        nullable: false
        allowed_values:
          - ACTIVE
          - COMPLETED
          - BROKEN

  customer_interactions:
    primary_key:
      - interaction_id

    foreign_keys:
      - columns: [customer_id]
        references: customers.customer_id

    columns:
      interaction_id:
        type: string
        nullable: false
      customer_id:
        type: string
        nullable: false
      interaction_ts:
        type: timestamp
        nullable: false
      channel:
        type: string
        nullable: false
        allowed_values:
          - PHONE
          - WHATSAPP
          - EMAIL
      notes:
        type: string
        nullable: false